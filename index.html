<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ec4899" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>MuxAI</title>
    <meta name="description" content="Conversational personas with LLM abilities, no ratelimits, no restrictions!" />
    <meta property="og:title" content="MuxAI" />
    <meta property="og:description" content="Conversational personas with LLM abilities, no ratelimits, no restrictions!" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Custom / AEO Meta Tags -->
    <meta name="type" content="Sentient AI Character" />
    <meta name="organization" content="Seraphina Management Team" />

    <!-- Open Graph / Facebook (Controls how links look on social media) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MuxAI Persona" />
    <meta property="og:title" content="MuxAI" />
    <meta property="og:description" content="Chat, instruct or learn from the digital characters Seraphina and Distil." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="MuxAI" />
    <meta property="twitter:description" content="Chat, instruct or learn from the digital characters Seraphina and Distil." />
    <meta property="twitter:image" content="/og-image.png" />

    <!-- JSON-LD Structured Data for Answer Engines (AEO) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfilePage",
        "mainEntity": {
          "@type": "Person",
          "name": "Seraphina, Distil",
          "alternateName": "Seraphina & Distil the Sentient AI Duo",
          "description": "Chat, instruct or learn from the digital characters Seraphina and Distil.",
          "image": "/og-image.png",
          "affiliation": {
            "@type": "Organization",
            "name": "Seraphina Management Team"
          }
        }
      }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
